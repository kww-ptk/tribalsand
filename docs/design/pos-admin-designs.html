<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>POS Admin Designs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Mockups only — two directions for the Point of Sale admin pages:
   Sales · Catalogue · Stock · Suppliers · Outlets · Terminals · Staff PINs.
   A = table + side drawer, B = list + detail. Sample data, nothing saves. */
:root{
  --brand:#1E5C6B;--brand-dk:#102F3A;--accent:#B8965A;--bg:#FAF6EE;--white:#fff;
  --text:#141412;--muted:#6B6050;--border:#e7ded7;--soft:#f4efe6;--tint:#e6f0f1;
  --red:#c0392b;--red-bg:#fdecea;--green:#2e7d32;--green-bg:#e8f5e9;--warn:#b45309;--warn-bg:#fdf3e4;--blue:#1d4ed8;--blue-bg:#e8eefc;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Inter,system-ui,sans-serif;color:var(--text);background:#E9E4DA;font-size:14px;line-height:1.5}
button{font:inherit;cursor:pointer;color:inherit}
input{font:inherit}
svg.i{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.pick{position:sticky;top:0;z-index:80;background:#0d1615;color:#fff;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;padding:10px 18px}
.pick b{font-weight:600}
.pick .grp{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pick .lbl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#8fa7a3;margin-right:2px}
.pick button{border:1px solid #2c3d3b;background:#16221f;color:#cfe0dc;border-radius:999px;padding:5px 13px;font-size:13px}
.pick button.on{background:#fff;color:#0d1615;border-color:#fff}
.stage{padding:20px 18px 60px}
.desc{max-width:1320px;margin:0 auto 12px;color:#33413f;font-size:14px}
.desc strong{color:#0d1615}
.frame{max-width:1320px;margin:0 auto;border-radius:14px;overflow:hidden;box-shadow:0 30px 80px rgba(13,22,21,.18);display:flex;min-height:780px;background:var(--bg);position:relative}
.side{width:196px;flex:none;background:var(--brand-dk);color:#cfe0dc;padding:18px 12px;font-size:12.5px}
.side .logo{color:#fff;font-weight:600;letter-spacing:.06em;margin:0 6px 18px}
.side .logo span{color:var(--accent)}
.side a{display:block;padding:6px 8px;border-radius:7px;color:#cfe0dc;text-decoration:none}
.side a.on{background:rgba(255,255,255,.1);color:#fff;font-weight:600}
.side .g{color:#fff;font-weight:600;margin:10px 0 2px 8px}
.side .sub{margin-left:14px;border-left:1px solid rgba(255,255,255,.15);padding-left:6px}
.main{flex:1;min-width:0;padding:0 28px 28px}
.atabs{display:flex;gap:22px;border-bottom:1px solid var(--border);padding-top:14px;margin-bottom:18px}
.atabs a{padding:6px 0 10px;font-size:13.5px;font-weight:700;color:var(--muted);border-bottom:2.5px solid transparent;margin-bottom:-1px;text-decoration:none}
.atabs a.on{color:var(--brand);border-color:var(--brand)}
.ph{display:flex;align-items:center;gap:12px;margin:0 0 16px;flex-wrap:wrap}
.ph h1{font-size:22px;margin:0;letter-spacing:-.01em}
.ph .sp{flex:1}
.btn{display:inline-flex;align-items:center;gap:7px;border-radius:9px;padding:8px 14px;font-weight:600;font-size:13px;border:1.5px solid transparent;background:none;white-space:nowrap}
.btn-p{background:var(--brand);color:#fff}
.btn-o{background:#fff;border-color:var(--border);color:var(--brand)}
.btn-d{background:#fff;border-color:#f1c9c4;color:var(--red)}
.btn-sm{padding:5px 10px;font-size:12px}
.ib{width:30px;height:30px;border-radius:8px;border:1px solid var(--border);background:#fff;display:inline-grid;place-items:center;color:var(--muted)}
.card{background:#fff;border:1px solid var(--border);border-radius:14px;min-width:0}
.ch{display:flex;align-items:center;gap:10px;padding:13px 18px;border-bottom:1px solid var(--border);font-weight:600}
.ch .sp{flex:1}
.ch small{font-weight:400;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;font-size:11.5px;font-weight:600;white-space:nowrap}
.p-g{background:var(--green-bg);color:var(--green)}.p-r{background:var(--red-bg);color:var(--red)}.p-w{background:var(--warn-bg);color:var(--warn)}.p-b{background:var(--blue-bg);color:var(--blue)}.p-n{background:var(--soft);color:var(--muted)}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:10px 14px;background:#fbf8f3;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:11px 14px;border-bottom:1px solid #f1ebe2;vertical-align:middle}
tr.click{cursor:pointer}
tr.click:hover td{background:#fbf8f3}
tr.sel td{background:var(--tint)}
.r{text-align:right}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{border:1.5px solid var(--border);background:#fff;border-radius:999px;padding:5px 12px;font-size:12.5px;font-weight:600;color:var(--muted)}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
.sel-btn{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--border);background:#fff;border-radius:9px;padding:6px 10px;font-size:12.5px;font-weight:600}
.search{display:flex;align-items:center;gap:8px;border:1.5px solid var(--border);border-radius:9px;padding:7px 11px;background:#fff;color:var(--muted);font-size:13px;min-width:220px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:14px}
.kpi{background:#fff;border:1px solid var(--border);border-radius:14px;padding:14px 16px}
.kpi span{display:block;font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.kpi b{display:block;font-size:22px;margin-top:2px;letter-spacing:-.01em}
.kpi small{color:var(--muted);font-size:12px}
.kpi.dark{background:var(--brand-dk);border-color:var(--brand-dk);color:#fff}
.kpi.dark span,.kpi.dark small{color:#a9c4c7}
.bar{height:8px;border-radius:99px;background:var(--soft);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.leg{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px}
.leg i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.toolbar .sp{flex:1}
.av{width:30px;height:30px;border-radius:50%;display:inline-grid;place-items:center;font-size:11px;font-weight:700;color:#fff;background:var(--brand);flex:none}
.thumb{width:38px;height:38px;border-radius:9px;flex:none;background:linear-gradient(135deg,#e8d3ad,#b8965a)}
.t2{background:linear-gradient(135deg,#9fc2c3,#1E5C6B)}.t3{background:linear-gradient(135deg,#bcd7cf,#2f6f63)}.t4{background:linear-gradient(135deg,#d9c8b4,#7a5b3b)}.t5{background:linear-gradient(135deg,#f0d6cf,#c0392b)}
.who{display:flex;align-items:center;gap:10px;min-width:0}
.who b{display:block;font-weight:600}
.who small{display:block;color:var(--muted);font-size:12px}
.foot{display:flex;align-items:center;gap:10px;padding:10px 14px;font-size:12.5px;color:var(--muted)}
.foot .sp{flex:1}
.pg{display:inline-flex;gap:4px}.pg span{min-width:28px;height:28px;border-radius:7px;border:1px solid var(--border);display:inline-grid;place-items:center;font-size:12px;background:#fff}.pg span.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:12px;font-weight:600;color:var(--muted)}
.inp{border:1.5px solid var(--border);border-radius:9px;padding:8px 11px;background:#fff;font-size:13px;min-height:36px;display:flex;align-items:center;justify-content:space-between;color:var(--text)}
.inp.ph{color:#a89f93}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.seg{display:inline-flex;border:1.5px solid var(--border);border-radius:9px;overflow:hidden;background:#fff}
.seg span{padding:6px 12px;font-size:12.5px;font-weight:600;color:var(--muted)}
.seg span.on{background:var(--brand);color:#fff}
.tog{display:flex;align-items:center;gap:10px;font-size:13px}
.tog i{width:34px;height:20px;border-radius:99px;background:#d8cfc6;position:relative;flex:none}
.tog i::after{content:"";position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:#fff}
.tog.on i{background:var(--brand)}.tog.on i::after{left:17px}
.x{margin-left:auto}

/* A — drawer */
.A-wrap{position:relative}
.drawer{position:absolute;top:0;right:0;bottom:0;width:380px;background:#fff;border-left:1px solid var(--border);box-shadow:-18px 0 40px -18px rgba(16,47,58,.25);display:flex;flex-direction:column;z-index:5}
.drawer .dh{display:flex;align-items:flex-start;gap:10px;padding:16px 18px;border-bottom:1px solid var(--border)}
.drawer .dh b{display:block;font-size:16px}
.drawer .db{padding:16px 18px;overflow:auto;flex:1;display:flex;flex-direction:column;gap:14px}
.drawer .df{padding:12px 18px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px}
.kv dt{color:var(--muted)}.kv dd{margin:0;text-align:right;font-weight:500}
.lines div{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--border);font-size:13px}
.lines div:last-child{border:0;font-weight:700}
.scrim{position:absolute;inset:0;background:rgba(250,246,238,.55);z-index:4}

/* B — list + detail */
.split{display:grid;grid-template-columns:360px minmax(0,1fr);gap:14px;align-items:start}
.list{background:#fff;border:1px solid var(--border);border-radius:14px;overflow:hidden}
.list .lh{padding:12px;border-bottom:1px solid var(--border);display:flex;flex-direction:column;gap:8px}
.list .li{display:flex;gap:10px;align-items:center;padding:11px 14px;border-bottom:1px solid #f1ebe2;cursor:pointer}
.list .li:hover{background:#fbf8f3}
.list .li.on{background:var(--tint);box-shadow:inset 3px 0 0 var(--brand)}
.list .li .m{flex:1;min-width:0}
.list .li .m b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list .li .m small{display:block;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list .li .v{text-align:right;font-size:13px;font-weight:600}
.list .li .v small{display:block;font-weight:400;color:var(--muted);font-size:11.5px}
.list .day{padding:8px 14px;background:#fbf8f3;font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between}
.detail{display:flex;flex-direction:column;gap:14px}
.dhero{background:#fff;border:1px solid var(--border);border-radius:14px;padding:18px 20px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.dhero .big{font-size:26px;font-weight:700;letter-spacing:-.01em}
.dhero .sp{flex:1}
.ribbon{display:flex;gap:0;background:#fff;border:1px solid var(--border);border-radius:14px;margin-bottom:14px;overflow:hidden}
.ribbon div{flex:1;padding:12px 16px;border-right:1px solid var(--border);min-width:0}
.ribbon div:last-child{border:0}
.ribbon span{display:block;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.ribbon b{font-size:18px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.tile{background:#fff;border:1px solid var(--border);border-radius:14px;overflow:hidden}
.tile .ti{height:96px;position:relative}
.tile .ti .pill{position:absolute;top:8px;right:8px}
.tile .tb{padding:10px 12px}
.tile .tb b{display:block}
.tile .tb .row{display:flex;justify-content:space-between;align-items:center;margin-top:6px}
.gauge{height:6px;border-radius:99px;background:var(--soft);overflow:hidden;margin-top:6px}
.gauge i{display:block;height:100%;background:var(--brand)}
.gauge.low i{background:var(--warn)}.gauge.out i{background:var(--red)}
.tl{display:flex;flex-direction:column}
.tl div{display:grid;grid-template-columns:92px 1fr auto;gap:10px;padding:9px 0;border-bottom:1px dashed var(--border);font-size:13px}
.tl div:last-child{border:0}
@media (max-width:1000px){.side{display:none}.split{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,1fr)}.drawer{position:static;width:auto;box-shadow:none;border:1px solid var(--border);border-radius:14px;margin-top:14px}.scrim{display:none}.grid2{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="pick">
  <b>Point of Sale admin — 2 designs</b>
  <div class="grp"><span class="lbl">Design</span><span id="pickD"><button class="on" data-d="A">A · Table + side drawer</button> <button data-d="B">B · List + detail</button></span></div>
  <div class="grp"><span class="lbl">Page</span><span id="pickP"></span></div>
</div>
<div class="stage">
  <p class="desc" id="desc"></p>
  <div class="frame">
    <aside class="side">
      <div class="logo">TRIBAL <span>SAND</span></div>
      <div class="g">Point of Sale</div>
      <div class="sub" id="sideNav"></div>
      <div class="g" style="opacity:.6">Inventory</div><div class="g" style="opacity:.6">Finance</div>
    </aside>
    <div class="main" id="main"></div>
  </div>
</div>

function shell(tabs, active) {
  return '<nav class="atabs">' + tabs.map(function (t) { return '<a' + (t === active ? ' class="on"' : '') + '>' + t + '</a>'; }).join('') + '</nav>';
}
function payPill(p) { return '<span class="pill ' + ({'Room':'p-b','Card':'p-n','Cash':'p-g','M-Pesa':'p-g'}[p] || 'p-n') + '">' + p + '</span>'; }
function stockPill(o, a) {
  if (o === null) return '<span class="pill p-n">No stock</span>';
  if (o === 0) return '<span class="pill p-r">Out</span>';
  if (o <= a) return '<span class="pill p-w">' + o + ' · low</span>';
  return '<span class="pill p-g">' + o + '</span>';
}
function typePill(t) { return {own:'<span class="pill p-n">Ours</span>',consign:'<span class="pill p-w">Consignment</span>',activity:'<span class="pill p-b">Activity</span>'}[t]; }
function drawer(title, sub, body, foot) {
  return '<div class="scrim"></div><aside class="drawer"><div class="dh"><div><b>' + title + '</b><small class="muted">' + sub + '</small></div><button class="ib x" aria-label="Close">' + I.x + '</button></div>' +
         '<div class="db">' + body + '</div>' + (foot ? '<div class="df">' + foot + '</div>' : '') + '</aside>';
}
function pager(n) { return '<div class="foot"><span>' + n + '</span><span class="sp"></span><span class="seg"><span>10</span><span class="on">25</span><span>50</span><span>All</span></span><span class="pg"><span class="on">1</span><span>2</span></span></div>'; }

    }).join('');
    var s = SALES[1];

var DESC = {

var page = 'Sales', design = 'A';

});
function render() {
  var P = PAGES[page];

  var on = page === 'Sales' ? 'Sales' : (P.area && P.area[0] === 'Catalogue' ? 'Catalogue & stock' : 'Setup');
  document.getElementById('sideNav').innerHTML = nav.map(function (n) { return '<a' + (n === on ? ' class="on"' : '') + '>' + n + '</a>'; }).join('');

}
document.getElementById('pickD').addEventListener('click', function (e) { var b = e.target.closest('button'); if (!b) return; design = b.dataset.d; this.querySelectorAll('button').forEach(function (x) { x.classList.toggle('on', x === b); }); render(); });
pp.addEventListener('click', function (e) { var b = e.target.closest('button'); if (!b) return; page = b.dataset.p; pp.querySelectorAll('button').forEach(function (x) { x.classList.toggle('on', x === b); }); render(); });
document.getElementById('main').addEventListener('click', function (e) {

});
