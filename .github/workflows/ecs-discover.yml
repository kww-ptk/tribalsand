name: Discover ECS cluster/service names

# One-off, READ-ONLY helper. Prints the ECS clusters and services this repo's
# AWS credentials can see, so the real rollout step in deploy.yml can be wired
# up with the correct names. Manual trigger only — never runs on a push.
# Safe to delete once deploy.yml has the rollout step.

on:
  workflow_dispatch:

env:
  AWS_REGION: eu-west-1

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Who am I
        run: aws sts get-caller-identity || echo "!! sts:GetCallerIdentity denied"

      - name: List ECS clusters
        run: |
          echo "--- clusters ---"
          aws ecs list-clusters --region "$AWS_REGION" \
            || echo "!! ecs:ListClusters DENIED — the IAM user likely has ECR-only permissions"

      - name: List services per cluster
        run: |
          set +e
          ARNS=$(aws ecs list-clusters --region "$AWS_REGION" --query 'clusterArns[]' --output text 2>/dev/null)
          if [ -z "$ARNS" ]; then
            echo "!! no clusters returned (denied, or none in $AWS_REGION)"
            exit 0
          fi
          for C in $ARNS; do
            echo "=== cluster: $C"
            aws ecs list-services --cluster "$C" --region "$AWS_REGION" --output text \
              || echo "!! ecs:ListServices denied for $C"
          done

      - name: Can this user actually deploy?
        run: |
          set +e
          echo "--- probing ecs:UpdateService (dry check via describe) ---"
          ARNS=$(aws ecs list-clusters --region "$AWS_REGION" --query 'clusterArns[]' --output text 2>/dev/null)
          for C in $ARNS; do
            SVCS=$(aws ecs list-services --cluster "$C" --region "$AWS_REGION" --query 'serviceArns[]' --output text 2>/dev/null)
            for S in $SVCS; do
              echo "=== $S"
              aws ecs describe-services --cluster "$C" --services "$S" --region "$AWS_REGION" \
                --query 'services[0].{name:serviceName,status:status,taskDef:taskDefinition,desired:desiredCount,running:runningCount}' \
                --output table || echo "!! ecs:DescribeServices denied"
            done
          done
