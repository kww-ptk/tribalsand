services:
  - type: web
    name: tribalsand
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: APP_URL
        value: https://tribalsand.com
      - key: SITE_URL
        value: https://tribalsand.com
      - key: MAIL_FROM
        value: noreply@tribalsand.com
      - key: MAIL_DRIVER
        value: mail
      - key: RESEND_API_KEY
        sync: false
      - key: BOOKING_TOKEN_SECRET
        generateValue: true
      - key: ICAL_SYNC_SECRET
        generateValue: true
      - key: HCAPTCHA_SITE_KEY
        sync: false
      - key: HCAPTCHA_SECRET_KEY
        sync: false
      - key: GHL_API_KEY
        sync: false
      - key: GHL_LOCATION_ID
        sync: false
      - key: GHL_PIPELINE_ID
        sync: false
      - key: GHL_STAGE_ID
        sync: false

  - type: cron
    name: tribalsand-expire-holds
    runtime: docker
    dockerfilePath: ./Dockerfile
    schedule: "*/5 * * * *"
    dockerCommand: php bin/ical-expire-holds.php
    envVars:
      - key: DATABASE_URL
        sync: false
