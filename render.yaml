services:
  - type: web
    name: tribalsand
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: APP_URL
        value: https://tribalsand.com
      - key: SITE_URL
        value: https://tribalsand.com
      # Origin for asset_url() (images/PDFs). Until the tribalsand.com domain is
      # cut over to this service, assets live on the Render host — point here so
      # image/PDF links resolve, else they 404 against the old host.
      - key: ASSET_URL
        value: https://tribalsand.onrender.com
      - key: MAIL_FROM
        value: noreply@tribalsand.com
      - key: MAIL_DRIVER
        value: mail
      - key: RESEND_API_KEY
        sync: false
      - key: BOOKING_TOKEN_SECRET
        generateValue: true
      - key: ICAL_SYNC_SECRET
        generateValue: true
      - key: TURNSTILE_SITE_KEY
        sync: false
      - key: TURNSTILE_SECRET_KEY
        sync: false
      - key: GHL_API_KEY
        sync: false
      - key: GHL_LOCATION_ID
        sync: false
      - key: GHL_PIPELINE_ID
        sync: false
      - key: GHL_STAGE_ID
        sync: false
      # Pre-Check-in private file storage (optional; set the value in the dashboard).
      # Set ONE so passport scans persist + stay private, else they go to ephemeral
      # temp and are wiped on redeploy:
      #   R2_CHECKIN_BUCKET   — a PRIVATE Cloudflare R2 bucket (no public domain), or
      #   CHECKIN_STORAGE_DIR — an absolute path on a Render persistent disk.

  - type: cron
    name: tribalsand-expire-holds
    runtime: docker
    dockerfilePath: ./Dockerfile
    schedule: "*/5 * * * *"
    dockerCommand: php bin/ical-expire-holds.php
    envVars:
      - key: DATABASE_URL
        sync: false
